name: Get reMarkable Token
on:
  workflow_dispatch:
    inputs:
      rm_code:
        description: 'Codice di 8 lettere da my.remarkable.com'
        required: true

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        run: |
          python -c "
          import requests
          import uuid
          
          # Nuovo endpoint per la registrazione dispositivi
          url = 'https://webapp-production-dot-remarkable-production.appspot.com/token/json/2/device/new'
          
          payload = {
              'code': '${{ github.event.inputs.rm_code }}',
              'deviceDesc': 'desktop-linux',
              'deviceID': str(uuid.uuid4())
          }
          
          res = requests.post(url, json=payload)
          
          if res.status_code == 200:
              print('\n' + '='*40)
              print('COPIA QUESTO TOKEN (stringa lunga):')
              print(res.text) 
              print('='*40 + '\n')
          else:
              print(f'Errore {res.status_code}: {res.text}')
          "