name: Generate Newspapers to Drive

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [news, nerd_science, altro]

    steps:
      - uses: actions/checkout@v4

      - name: Set Date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Generate PDF
        run: |
          docker pull ghcr.io/claudiotomasi/goosepaper:latest
          mkdir -p out

          docker run --rm --init \
            -v ${{ github.workspace }}:/mount \
            ghcr.io/claudiotomasi/goosepaper:latest \
            -c /mount/${{ matrix.config }}.json \
            -o /mount/out/${{ matrix.config }}_${{ env.DATE }}.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.config }}
          path: out/*.pdf

  upload:
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Upload to Google Drive
        uses: wei/rclone@v1
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_PASS }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: "1DtC3Da1Q1-TY8TBVbFXmHn9lDgSb_ehA"
        with:
          args: 'copy ./out gdrive:${{ env.DATE }} --include "*.pdf"'
